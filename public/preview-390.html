<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세트업 390×844 미리보기</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0f14;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        display: block;
        background: #070a10;
      }
    </style>
  </head>
  <body>
    <iframe id="preview" title="세트업 미리보기"></iframe>
    <script>
      const tab = new URLSearchParams(location.search).get('tab') || 'today';
      document.getElementById('preview').src = '/#/' + tab;
    </script>
  </body>
</html>
